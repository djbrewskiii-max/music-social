name: OVRLEE Weekly Public Music Refresh

# Scheduled Actions run from the repository default branch only.
# Keep this workflow on the default branch after testing on claude-build.
on:
  schedule:
    - cron: '23 9 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ovrlee-weekly-public-music-refresh
  cancel-in-progress: false

jobs:
  weekly-profile-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.OVRLEE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.OVRLEE_SUPABASE_SERVICE_ROLE_KEY }}
      MAX_PROFILES: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install isolated browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check required backend connection
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "Required Actions secrets are missing. No profile scan was performed."
            exit 1
          }
      - name: Refresh opted-in public profile snapshots
        run: node --experimental-strip-types tools/spotify-weekly-refresh.mjs
