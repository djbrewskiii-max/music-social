name: OVRLEE Quality Checks

# Single source of truth: a preview may only publish from this workflow after
# ALL required quality, iOS JS bundle and native parse jobs have succeeded.
on:
  push:
    branches: [claude-build]
  pull_request:
    branches: [main, claude-build]
  workflow_dispatch:
    inputs:
      confirm_preview:
        description: "Also publish this tested claude-build commit to the existing iOS preview channel?"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Generate Expo Router route types
        run: npx expo customize tsconfig.json
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types tools/profile-display.test.mjs
      - run: node --experimental-strip-types tools/collection-selection.test.mjs
      - run: node --experimental-strip-types tools/world-city-picker.test.mjs
      - run: node tools/prelaunch-appearance-audit.test.mjs
      - run: node tools/prelaunch-interaction-audit.test.mjs
      - run: node tools/prelaunch-reporting-policy.test.mjs
      - run: node tools/post-discovery-parity.test.mjs
      - run: node tools/post-track-parity.test.mjs
      - run: node tools/prelaunch-conversation-reliability.test.mjs
      - run: node tools/onboarding-first-run-audit.test.mjs
      - run: node tools/first-run-identity-consistency.test.mjs
      - run: node tools/world-city-directory-contract.test.mjs
      - run: node --check scripts/import-geonames-cities.mjs
      - run: node tools/launch-account-group-appearance.test.mjs
      - run: node tools/unaddressed-requests-audit.test.mjs
      - run: node tools/group-push-mute-contract.test.mjs
      - run: node tools/preview-deployment-gate.test.mjs
      - run: node tools/beta-release-config.test.mjs
      - run: node tools/beta-ui-brand.test.mjs
      - run: node --experimental-strip-types tools/spotify-oembed.test.mjs
      - run: node --experimental-strip-types tools/music-launch-sources.test.mjs
      - run: node --experimental-strip-types tools/music-suggestion-signals.test.mjs
      - run: node --experimental-strip-types tools/music-taste-evidence.test.mjs
      - run: node --experimental-strip-types tools/room-editions.test.mjs
      # Archived Spotify/ListenBrainz research tests remain under tools/
      # but are intentionally excluded from the active launch pipeline.

  ios-js-bundle:
    name: Export production-style iOS JavaScript bundle
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compile Expo iOS update bundle
        run: npx expo export --platform ios --output-dir /tmp/ovrlee-qa-ios-export --clear
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ebflucbdptxpboqjxaox.supabase.co
          EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_SibnO1c3UEAxA9dxtZ622w_3vUrnW_5
      - name: Verify bundle generated
        run: test -d /tmp/ovrlee-qa-ios-export && test -n "$(find /tmp/ovrlee-qa-ios-export -type f -print -quit)"

  spotify-native-swift-parse:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse the existing native Spotify bridge
        run: xcrun swiftc -frontend -parse now-spotify/ios/NowSpotifyModule.swift

  publish-preview:
    name: Publish verified iOS OTA preview
    needs: [typecheck, ios-js-bundle, spotify-native-swift-parse]
    if: >-
      github.ref == 'refs/heads/claude-build' &&
      (github.event_name == 'push' || inputs.confirm_preview == true)
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: ovrlee-ios-preview-publish
      cancel-in-progress: false
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://ebflucbdptxpboqjxaox.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_SibnO1c3UEAxA9dxtZ622w_3vUrnW_5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No stale queued workflow may overwrite a newer preview publication.
      - name: Check tested commit is still the branch head
        id: latest
        run: |
          HEAD_SHA="$(git ls-remote origin refs/heads/claude-build | cut -f1)"
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::Unable to determine current branch head."
            exit 1
          fi
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::Skipping superseded commit $GITHUB_SHA; latest is $HEAD_SHA"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject native changes incompatible with OTA preview
        if: steps.latest.outputs.publish == 'true'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "::error::No trustworthy push base for native compatibility check."
              exit 1
            fi
          else
            # Manual dispatch must not bypass a native-code change.
            BEFORE="$(git rev-parse "$GITHUB_SHA^")"
          fi
          CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          printf '%s\n' "$CHANGED"
          NATIVE="$(printf '%s\n' "$CHANGED" | grep -E '^(app\.json|eas\.json|package\.json|package-lock\.json|plugins/|now-spotify/|now-shazam/|patches/)' || true)"
          if [ -n "$NATIVE" ]; then
            echo "::error::Native dependency/config change requires a new EAS preview binary."
            echo "$NATIVE"
            exit 1
          fi

      - name: Require Expo deployment credential
        if: steps.latest.outputs.publish == 'true'
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository/environment secret is missing."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.latest.outputs.publish == 'true'
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
        if: steps.latest.outputs.publish == 'true'
      - name: Verify connected Expo preview identity
        if: steps.latest.outputs.publish == 'true'
        run: |
          npx eas-cli@latest whoami
          npx eas-cli@latest channel:view preview
      - name: Recheck branch head immediately before upload
        id: before-upload
        if: steps.latest.outputs.publish == 'true'
        run: |
          HEAD_SHA="$(git ls-remote origin refs/heads/claude-build | cut -f1)"
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::Cannot verify which commit is currently approved."
            exit 1
          fi
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::A newer commit arrived during setup; this older update will not publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish verified commit to iOS preview only
        if: steps.latest.outputs.publish == 'true' && steps.before-upload.outputs.publish == 'true'
        run: >-
          npx eas-cli@latest update
          --channel preview
          --environment preview
          --platform ios
          --message "OVRLEE tested preview ${{ github.sha }}"
          --non-interactive
