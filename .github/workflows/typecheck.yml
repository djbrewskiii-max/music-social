name: OVRLEE Quality Checks

on:
  push:
    branches: [claude-build]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node tools/playlist-snapshot-diff.test.mjs
      - run: node --experimental-strip-types tools/spotify-public-reader.test.mjs
      - run: node --experimental-strip-types tools/spotify-scan-diff.test.mjs
      - run: node --experimental-strip-types tools/music-suggestion-signals.test.mjs
      - run: node --experimental-strip-types tools/music-taste-evidence.test.mjs

  spotify-native-swift-parse:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse the existing native Spotify bridge
        run: xcrun swiftc -frontend -parse now-spotify/ios/NowSpotifyModule.swift
