name: OVRLEE Publish iOS Preview

on:
  workflow_dispatch:
    inputs:
      confirm_preview:
        description: "Publish only to the existing iOS preview channel?"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ovrlee-ios-preview-publish
  cancel-in-progress: false

jobs:
  publish-preview:
    if: github.ref == 'refs/heads/claude-build' && inputs.confirm_preview
    name: Verify and publish iOS OTA preview
    runs-on: ubuntu-latest
    environment: preview
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://ebflucbdptxpboqjxaox.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_SibnO1c3UEAxA9dxtZ622w_3vUrnW_5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require authenticated Expo deployment credential
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN must be configured as a GitHub Actions secret."
            exit 1
          fi
      - name: Generate routes and check types
        run: |
          npx expo customize tsconfig.json
          npx tsc --noEmit
      - name: Compile the iOS update payload
        run: npx expo export --platform ios --output-dir /tmp/ovrlee-preview-verify --clear
      - name: Verify target identity
        run: |
          npx eas-cli@latest whoami
          npx eas-cli@latest channel:view preview
      - name: Publish ONLY to preview
        run: |
          npx eas-cli@latest update \
            --channel preview --environment preview --platform ios --non-interactive \
            --message "OVRLEE iOS preview ${GITHUB_SHA:0:7}"
