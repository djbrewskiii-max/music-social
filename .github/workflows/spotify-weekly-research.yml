name: OVRLEE Weekly Public Music Profile Check

# Scheduled by GitHub from main. The collector runs from claude-build.
# GitHub OIDC authenticates directly with OVRLEE's Supabase Edge Function;
# no permanent backend secret is stored in GitHub.
# Research workflow deliberately disabled for commercial launch preparation.
# Do not re-enable browser collection without written provider permission.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ovrlee-weekly-public-music-refresh
  cancel-in-progress: false

jobs:
  weekly-profile-refresh:
    if: ${{ false }} # Disabled: no approved commercial Spotify data-collection route.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OVRLEE_SYNC_URL: https://ebflucbdptxpboqjxaox.supabase.co/functions/v1/ovrlee-weekly-public-sync
    steps:
      - name: Checkout current OVRLEE collector
        uses: actions/checkout@v4
        with:
          ref: claude-build
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check collector and identity client syntax
        run: |
          node --check tools/weekly-music-due-check.mjs
          node --check tools/weekly-music-identity.mjs
          node --check tools/spotify-weekly-refresh.mjs
      - name: Check which members are due through GitHub identity
        id: due
        run: node tools/weekly-music-due-check.mjs
      - name: Install isolated Chromium only when needed
        if: steps.due.outputs.has_due == 'true'
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Refresh opted-in profiles through verified GitHub identity
        if: steps.due.outputs.has_due == 'true'
        run: node --experimental-strip-types tools/spotify-weekly-refresh.mjs
