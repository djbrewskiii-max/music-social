name: Resolve WebView dependency lockfile
on:
  push:
    branches: [claude-build]
permissions:
  contents: write
jobs:
  lock:
    if: github.event.head_commit.message == 'Generate WebView package lock for OVRLEE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve exact dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Save generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Lock react-native-webview 13.16.1 for Expo SDK 57"
          git push origin HEAD:claude-build
